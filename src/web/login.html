<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · ollamaMQ</title>
<link rel="stylesheet" href="app.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body class="login-body">
<main class="login-wrap">
  <form class="login-card" id="login-form" autocomplete="on">
    <div class="login-brand"><span class="brand-mark">◆</span> ollamaMQ</div>
    <h1>Sign in</h1>
    <label>User name <input name="username" id="username" autocomplete="username" required autofocus spellcheck="false"></label>
    <label>Password <input name="password" id="password" type="password" autocomplete="current-password" required></label>
    <div class="login-error" id="login-error" role="alert" hidden></div>
    <button class="btn primary login-submit" type="submit" id="login-submit">Sign in</button>
    <p class="login-note">Stays signed in on this browser for 7 days.</p>
  </form>
</main>
<script src="login.js"></script>
</body>
</html>
