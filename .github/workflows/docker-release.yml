# Publishes ghcr.io/dmarchevsky/ollamamq (primary) and dmarchevsky/ollamamq on
# Docker Hub (transitional mirror for installs that still pull from there) for
# every release tag (v*). The tag is created in the dev-flow release stage from
# the Cargo.toml version, so image tags always match the release version.
name: docker-release

on:
  push:
    tags: ['v*']

# GITHUB_TOKEN pushes to ghcr.io; explicit because an org can default to read-only.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker Hub is still published so existing installs keep updating; drop this
      # step (and its two secrets) once GHCR has shipped a release or two.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ghcr.io/dmarchevsky/ollamamq
            dmarchevsky/ollamamq
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
