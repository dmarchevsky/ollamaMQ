# ollamaMQ with its whole configuration in one host folder.
#
#   <this folder>/
#   ├── docker-compose.yml   (this file)
#   ├── config/              -> /config  appconf.yaml, .env, and what the web UI
#   │                                    saves: clients.json, models.json,
#   │                                    settings.json, admin.json
#   └── logs/                -> /data    request logs, ollamamq.log (TUI mode)
#
# Every path is relative to this file, so moving the server is copying the
# folder. Store files named in appconf.yaml without a path are kept next to
# it, i.e. in config/.
services:
  ollamamq:
    # Build from GitHub (only pushed commits are deployed) ...
    build:
      context: https://github.com/dmarchevsky/ollamaMQ.git#master
    # ... or from a clone inside this folder:
    # build:
    #   context: ./src
    image: ollamamq:local
    pull_policy: build
    container_name: ollamamq
    ports:
      - "8081:11435"
    # Bypass the image entrypoint: it always passes --backend-urls, which
    # would override the backends in appconf.yaml.
    entrypoint: ["/app/ollamaMQ"]
    command: ["-c", "/config/appconf.yaml"]
    # The TUI dashboard: `docker attach ollamamq`, detach with Ctrl-P Ctrl-Q.
    # Without a TTY (or with --no-tui) logs go to `docker logs` instead.
    tty: true
    stdin_open: true
    working_dir: /data
    # OLLAMA_MQ_UI_USER / OLLAMA_MQ_UI_PASSWORD: the web UI's first-run (and
    # recovery) password; a password changed in the UI is kept in config/admin.json.
    env_file: ./config/.env
    environment:
      - RUST_LOG=info
      - TERM=xterm-256color
    volumes:
      - ./config:/config
      - ./logs:/data
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:11435/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
